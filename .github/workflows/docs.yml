name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Doxygen
        run: sudo apt-get install -y doxygen

      - name: Download Doxygen Awesome theme
        run: |
          curl -sL \
            https://raw.githubusercontent.com/jothepro/doxygen-awesome-css/v2.3.4/doxygen-awesome.css \
            -o doc/doxygen-awesome.css

      - name: Generate Doxyfile
        run: |
          sed "s|@CMAKE_CURRENT_SOURCE_DIR@|$GITHUB_WORKSPACE/doc|g" \
            doc/Doxyfile.in > doc/Doxyfile

      - name: Build documentation
        working-directory: doc
        run: doxygen Doxyfile

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc/oifitslib/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
